<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Mira Joint Soft-Chews — 60-count jar">
  <defs>
    <linearGradient id="bg-joint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7E9CC"/>
      <stop offset="1" stop-color="#D9BC8A"/>
    </linearGradient>
    <radialGradient id="bgGlow-joint" cx="0.3" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#F4F0E6"/>
      <stop offset="1" stop-color="#D8CFB6"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3F5D4D"/>
      <stop offset="1" stop-color="#1F2A24"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C4A3C"/>
      <stop offset="1" stop-color="#1B3026"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="8"/>
      <feColorMatrix values="0 0 0 0 0.12  0 0 0 0 0.16  0 0 0 0 0.14  0 0 0 0.32 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="600" height="600" fill="url(#bg-joint)"/>
  <rect width="600" height="600" fill="url(#bgGlow-joint)"/>

  <!-- shadow under jar -->
  <ellipse cx="300" cy="510" rx="170" ry="22" fill="#000" opacity="0.12"/>

  <!-- jar group -->
  <g filter="url(#softShadow)">
    <!-- jar body -->
    <rect x="170" y="160" width="260" height="340" rx="36" fill="url(#jar)" stroke="#B4A985" stroke-width="2"/>
    <!-- jar shine -->
    <rect x="180" y="180" width="80" height="290" rx="20" fill="url(#shine)"/>
    <!-- lid base ring -->
    <rect x="160" y="120" width="280" height="44" rx="14" fill="#2C4A3C"/>
    <!-- lid top -->
    <rect x="170" y="100" width="260" height="32" rx="10" fill="url(#lid)"/>
    <!-- lid grip lines -->
    <g stroke="#5B7A6A" stroke-width="1.6" opacity="0.55">
      <line x1="190" y1="110" x2="190" y2="124"/>
      <line x1="206" y1="110" x2="206" y2="124"/>
      <line x1="222" y1="110" x2="222" y2="124"/>
      <line x1="238" y1="110" x2="238" y2="124"/>
      <line x1="254" y1="110" x2="254" y2="124"/>
      <line x1="270" y1="110" x2="270" y2="124"/>
      <line x1="330" y1="110" x2="330" y2="124"/>
      <line x1="346" y1="110" x2="346" y2="124"/>
      <line x1="362" y1="110" x2="362" y2="124"/>
      <line x1="378" y1="110" x2="378" y2="124"/>
      <line x1="394" y1="110" x2="394" y2="124"/>
      <line x1="410" y1="110" x2="410" y2="124"/>
    </g>

    <!-- label -->
    <rect x="190" y="200" width="220" height="270" rx="10" fill="url(#label)" stroke="#0F1814" stroke-width="1"/>
    <!-- label inner border -->
    <rect x="200" y="210" width="200" height="250" rx="6" fill="none" stroke="#D4A24A" stroke-width="1.5" opacity="0.8"/>

    <!-- Mira mark -->
    <circle cx="300" cy="248" r="22" fill="none" stroke="#D4A24A" stroke-width="2"/>
    <text x="300" y="258" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#D4A24A" text-anchor="middle">M</text>

    <!-- brand wordmark -->
    <text x="300" y="310" font-family="Georgia, serif" font-style="italic" font-weight="600" font-size="46" fill="#FAF6F0" text-anchor="middle" letter-spacing="2">Mira</text>

    <!-- divider -->
    <line x1="240" y1="328" x2="360" y2="328" stroke="#D4A24A" stroke-width="1" opacity="0.5"/>

    <!-- product line -->
    <text x="300" y="358" font-family="Inter, sans-serif" font-weight="600" font-size="14" fill="#FAF6F0" text-anchor="middle" letter-spacing="3">JOINT &amp; HIP</text>
    <text x="300" y="380" font-family="Inter, sans-serif" font-weight="400" font-size="11" fill="#D4A24A" text-anchor="middle" letter-spacing="2">FOR SENIOR DOGS</text>

    <!-- count -->
    <text x="300" y="430" font-family="Georgia, serif" font-weight="600" font-size="32" fill="#FAF6F0" text-anchor="middle">60</text>
    <text x="300" y="448" font-family="Inter, sans-serif" font-weight="400" font-size="9" fill="#D4A24A" text-anchor="middle" letter-spacing="2.4">SOFT CHEWS</text>
  </g>
</svg>
