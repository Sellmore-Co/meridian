<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-label="Meridian The Duo Expert variant A: smoked-glass bottles with brushed-gold caps">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="60%" stop-color="#F0EBDD"/>
      <stop offset="100%" stop-color="#E5DFCE"/>
    </radialGradient>
    <!-- Smoked translucent glass -->
    <linearGradient id="glassA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#1A1F1C"/>
      <stop offset="20%" stop-color="#3B403B"/>
      <stop offset="50%" stop-color="#4D5450"/>
      <stop offset="80%" stop-color="#2E3330"/>
      <stop offset="100%" stop-color="#0E1110"/>
    </linearGradient>
    <linearGradient id="glassB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#161B19"/>
      <stop offset="20%" stop-color="#363C38"/>
      <stop offset="50%" stop-color="#474D49"/>
      <stop offset="80%" stop-color="#2A302D"/>
      <stop offset="100%" stop-color="#0A0E0C"/>
    </linearGradient>
    <!-- Brushed gold cap -->
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#7C5F2F"/>
      <stop offset="20%" stop-color="#C99A52"/>
      <stop offset="40%" stop-color="#E2BE7B"/>
      <stop offset="55%" stop-color="#F2D89B"/>
      <stop offset="70%" stop-color="#D5AC68"/>
      <stop offset="100%" stop-color="#5E4520"/>
    </linearGradient>
    <linearGradient id="bodyShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="bottomShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#000" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="bottleShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.34"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#bg)"/>
  <ellipse cx="250" cy="408" rx="170" ry="14" fill="url(#bottomShadow)"/>

  <!-- BOTTLE 2 (back) — Vitamin C Serum (pump) — smoked glass + gold cap -->
  <g filter="url(#bottleShadow)" transform="translate(285,68)">
    <rect x="20" y="60" width="86" height="22" rx="2" fill="url(#goldCap)"/>
    <rect x="28" y="38" width="70" height="22" rx="2" fill="url(#goldCap)"/>
    <rect x="56" y="20" width="14" height="20" rx="1.5" fill="#3D2C10"/>
    <rect x="40" y="32" width="34" height="5" rx="1" fill="#3D2C10"/>
    <rect x="22" y="80" width="82" height="6" fill="#1F2520"/>
    <rect x="14" y="86" width="98" height="248" rx="3" fill="url(#glassB)"/>
    <rect x="14" y="86" width="98" height="248" rx="3" fill="url(#bodyShine)"/>
    <rect x="108" y="86" width="2" height="248" fill="#000" fill-opacity="0.10"/>
    <rect x="14"  y="86" width="2" height="248" fill="#FFF" fill-opacity="0.10"/>
    <g font-family="ui-monospace, 'JetBrains Mono', monospace" fill="#F2D89B" text-anchor="middle">
      <text x="63" y="180" font-size="6.4" letter-spacing="2.0">M·E·R·I·D·I·A·N</text>
      <line x1="38" y1="190" x2="88" y2="190" stroke="#F2D89B" stroke-width="0.6" stroke-opacity="0.7"/>
      <text x="63" y="218" font-size="13" letter-spacing="0.6" font-weight="500">VITAMIN C</text>
      <text x="63" y="234" font-size="9.5" letter-spacing="1.2">20% L-ASCORBIC</text>
      <text x="63" y="270" font-size="6.4" letter-spacing="1.4" fill-opacity="0.7">EXPERT · 30ML</text>
    </g>
    <rect x="14" y="328" width="98" height="6" rx="2" fill="#000" fill-opacity="0.34"/>
  </g>

  <!-- BOTTLE 1 (front) — Bakuchiol Renewal Oil (dropper) — smoked glass + gold cap -->
  <g filter="url(#bottleShadow)" transform="translate(105,88)">
    <ellipse cx="63" cy="14" rx="22" ry="14" fill="url(#goldCap)"/>
    <rect x="51" y="20" width="24" height="14" rx="2" fill="url(#goldCap)"/>
    <rect x="20" y="34" width="86" height="34" rx="2" fill="url(#goldCap)"/>
    <g fill="#7C5F2F" fill-opacity="0.6">
      <rect x="22" y="40" width="82" height="0.7"/>
      <rect x="22" y="46" width="82" height="0.7"/>
      <rect x="22" y="52" width="82" height="0.7"/>
      <rect x="22" y="58" width="82" height="0.7"/>
    </g>
    <rect x="22" y="68" width="82" height="6" fill="#1F2520"/>
    <rect x="14" y="74" width="98" height="244" rx="3" fill="url(#glassA)"/>
    <rect x="14" y="74" width="98" height="244" rx="3" fill="url(#bodyShine)"/>
    <rect x="59" y="74" width="8" height="120" rx="2" fill="#000" fill-opacity="0.20"/>
    <rect x="62" y="74" width="2" height="160" fill="#000" fill-opacity="0.30"/>
    <rect x="108" y="74" width="2" height="244" fill="#000" fill-opacity="0.10"/>
    <rect x="14"  y="74" width="2" height="244" fill="#FFF" fill-opacity="0.10"/>
    <g font-family="ui-monospace, 'JetBrains Mono', monospace" fill="#F2D89B" text-anchor="middle">
      <text x="63" y="178" font-size="6.4" letter-spacing="2.0">M·E·R·I·D·I·A·N</text>
      <line x1="38" y1="188" x2="88" y2="188" stroke="#F2D89B" stroke-width="0.6" stroke-opacity="0.7"/>
      <text x="63" y="216" font-size="13" letter-spacing="0.6" font-weight="500">BAKUCHIOL</text>
      <text x="63" y="232" font-size="9.5" letter-spacing="1.2">1.0% RENEWAL</text>
      <text x="63" y="270" font-size="6.4" letter-spacing="1.4" fill-opacity="0.7">EXPERT · 30ML</text>
    </g>
    <rect x="14" y="312" width="98" height="6" rx="2" fill="#000" fill-opacity="0.34"/>
  </g>
</svg>
