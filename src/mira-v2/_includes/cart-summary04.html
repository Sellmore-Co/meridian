{% comment %}
  cart-summary04 — order summary panel for Mira checkout right column.
  data-next-cart-summary surfaces the SDK's reactive line items and totals.
{% endcomment %}
<div data-next-catalog-component="order-summary" class="summary-wrapper" data-next-cart-summary>
  <template>
    <div class="order-summary">
      <h4 class="order-summary__title">Order Summary</h4>
      <div class="order-summary__content">

        <div class="cart-items">
          <div class="cart-items__list" data-summary-lines>
            <template>
              <div data-package-id="{item.packageId}" class="cart-item">
                <div class="cart-item__wrapper">
                  <div class="cart-item__image-container">
                    <div class="cart-item__quantity-badge"><div class="cart-item__quantity">{item.quantity}</div></div>
                    <img src="{item.image}" alt="{item.name}" class="cart-item__image">
                  </div>
                  <div class="cart-item__details">
                    <div class="cart-item__content">
                      <div class="cart-item__description">
                        <div class="cart-item__header">
                          <div class="cart-item__title">{item.name}</div>
                        </div>
                        <div class="cart-item__frequency">
                          <span data-next-show="item.isRecurring" style="display:none">{item.frequency}</span>
                          <span data-next-hide="item.isRecurring">One-time purchase</span>
                        </div>
                      </div>
                      <div class="cart-item__pricing">
                        <div class="cart-price price--original {item.hasDiscount}">{item.originalPrice}</div>
                        <div class="checkout__line-item__final-price">{item.price}</div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </div>

        <div class="order-totals os-cart-summary-totals">
          <div class="order-totals__section">
            <div class="order-totals__line">
              <div class="order-totals__label">Subtotal</div>
              <div class="order-totals__value">{subtotal}</div>
            </div>
          </div>

          <div class="order-totals__section">
            <ul class="order-totals__discount-list" data-next-discounts="offer" aria-label="Offer discounts">
              <template>
                <li class="order-totals__line">
                  <div class="order-totals__label text-muted">{discount.name}</div>
                  <div class="order-totals__value text-muted">-{discount.amount}</div>
                </li>
              </template>
            </ul>
            <ul class="order-totals__discount-list" data-next-discounts="voucher" aria-label="Voucher discounts">
              <template>
                <li class="order-totals__line">
                  <div class="order-totals__label text-muted">{discount.name}</div>
                  <div class="order-totals__value text-muted">-{discount.amount}</div>
                </li>
              </template>
            </ul>
          </div>

          <div class="order-totals__section">
            <div class="order-totals__line">
              <div class="order-totals__label">Shipping</div>
              <div class="order-totals__value order-totals__value--shipping">{shipping}</div>
            </div>
            <div class="order-totals__line os-cart-summary-row--tax">
              <div class="order-totals__label">Sales tax</div>
              <div class="order-totals__value">{tax}</div>
            </div>
          </div>

          <div class="order-totals__total">
            <div class="order-totals__label">Total</div>
            <div class="order-totals__value">{total}</div>
          </div>
          <div data-next-show="cart.hasDiscounts" style="display:none" class="order-savings">You're saving {discounts} today</div>
        </div>

        <div class="summary__trust">
          <div><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 8 7 12 13 4"/></svg>90-day money-back guarantee — no questions</div>
          <div><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 8 7 12 13 4"/></svg>Ships in 24h from Boulder · 2-4 day delivery</div>
          <div><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 8 7 12 13 4"/></svg>Skip, pause, or cancel anytime</div>
        </div>

      </div>
    </div>
  </template>
</div>
