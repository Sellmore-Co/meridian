<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thank you — TEST</title>
    <style>
      :root { --ink: #15110d; --paper: #fbf7f0; --card: #fff; --accent: #b5481f; --line: #e7ddcd; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--ink); background: var(--paper); }
      .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px 80px; }
      h1 { font-size: 30px; margin: 0 0 8px; }
      .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-top: 20px; }
      .note { font-size: 13px; color: #6b5d4c; }
    </style>
  </head>
  <body>
    <main data-page="receipt" class="wrap">
      <h1>Thank you for your order</h1>
      <p>A confirmation is on its way. Your TEST order is being prepared for shipment.</p>
      <!-- SDK-OWNED: order summary (line items, totals) renders from the limos receipt commerce surface -->
      <section class="panel" data-commerce-zone="receipt-summary">
        <h2 style="font-size:16px;margin:0 0 12px;">Order summary</h2>
        <p class="note">Order number, line items, and totals render here from the limos receipt template.</p>
      </section>
    </main>
  </body>
</html>
